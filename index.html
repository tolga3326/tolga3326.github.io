<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirate Dominion</title>
<meta name="description" content="Pirate Dominion: filonu kur, Kraken'i salıver, 20 çağ boyunca denizlerin hâkimi ol!">
<style>
  :root { --deep: #0b2e36; --cream: #fff3d6; --gold: #ffcf5a; --ink: #2b1608; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(#1f7a86, var(--deep)) fixed; color: var(--cream);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 56px; text-align: center; }
  img.logo { width: min(360px, 80vw); height: auto; border-radius: 28px; box-shadow: 0 14px 36px rgba(0, 0, 0, .4); }
  h1 { font-size: 2.2rem; margin: 24px 0 8px; color: var(--gold); text-shadow: 0 3px 0 var(--ink); }
  p.lead { font-size: 1.15rem; margin: 6px auto; max-width: 560px; }
  p.en { opacity: .85; }
  .links { margin-top: 28px; }
  .links a { display: inline-block; margin: 8px; padding: 12px 22px; border-radius: 999px; background: var(--gold);
             color: var(--ink); font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #b9860f; }
  footer { margin-top: 36px; font-size: .95rem; opacity: .8; }
  footer a { color: var(--cream); }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.jpg" alt="Pirate Dominion">
  <h1>Pirate Dominion</h1>
  <p class="lead">Filonu kur, Kraken'i salıver, 20 çağ boyunca denizlerin hâkimi ol!</p>
  <p class="lead en" lang="en">Build your fleet, unleash the Kraken and rule the seas through 20 ages!</p>
  <div class="links">
    <a href="privacy.html">Gizlilik Politikası</a>
    <a href="privacy.html#english" lang="en">Privacy Policy</a>
  </div>
  <footer>İletişim / Contact: <a href="mailto:ctnappstudio@gmail.com">ctnappstudio@gmail.com</a></footer>
</main>
</body>
</html>
